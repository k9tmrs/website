<svg xmlns="http://www.w3.org/2000/svg" width="119.66407" height="40" viewBox="0 0 119.66407 40" role="img" aria-label="Join the beta on TestFlight">
  <!-- Hand-authored to match the official App Store badge geometry (Apple ships no TestFlight web badge). -->
  <rect x="0.5" y="0.5" width="118.66407" height="39" rx="6.5" fill="#000" stroke="#a6a6a6" stroke-width="1"/>
  <defs>
    <linearGradient id="tf-icon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ec5ff"/>
      <stop offset="1" stop-color="#0f6fde"/>
    </linearGradient>
  </defs>
  <!-- TestFlight app icon: blue rounded square with a white three-blade propeller -->
  <rect x="9" y="9" width="22" height="22" rx="5" fill="url(#tf-icon)"/>
  <g fill="#fff">
    <g transform="rotate(0 20 20)"><ellipse cx="20" cy="14.6" rx="2.5" ry="4.3"/></g>
    <g transform="rotate(120 20 20)"><ellipse cx="20" cy="14.6" rx="2.5" ry="4.3"/></g>
    <g transform="rotate(240 20 20)"><ellipse cx="20" cy="14.6" rx="2.5" ry="4.3"/></g>
    <circle cx="20" cy="20" r="2.1"/>
  </g>
  <g fill="#fff" font-family="Helvetica, Arial, sans-serif">
    <text x="37" y="16" font-size="8.5" textLength="62" lengthAdjust="spacingAndGlyphs">Join the beta on</text>
    <text x="36.5" y="30.5" font-size="14.5" font-weight="bold" textLength="74" lengthAdjust="spacingAndGlyphs">TestFlight</text>
  </g>
</svg>
