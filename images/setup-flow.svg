<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" fill="none" role="img" aria-label="Three-step setup flow: download the app, connect your device, start timing">
  <defs>
    <linearGradient id="sf-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="sf-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="sf-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <!-- connectors -->
  <g stroke="#334155" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round">
    <line x1="206" y1="120" x2="314" y2="120"/>
    <line x1="446" y1="120" x2="554" y2="120"/>
  </g>
  <g fill="#475569">
    <path d="M316 120 l-12 -6 v12 z"/>
    <path d="M556 120 l-12 -6 v12 z"/>
  </g>

  <!-- Step 1: Download -->
  <g>
    <circle cx="148" cy="120" r="58" fill="rgba(37,99,235,0.10)" stroke="url(#sf-blue)" stroke-width="2.5"/>
    <rect x="130" y="92" width="36" height="56" rx="7" fill="none" stroke="#BFDBFE" stroke-width="2.5"/>
    <line x1="142" y1="100" x2="154" y2="100" stroke="#BFDBFE" stroke-width="2.5" stroke-linecap="round"/>
    <g stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="148" y1="112" x2="148" y2="132"/>
      <path d="M140 124 l8 8 l8 -8"/>
    </g>
    <circle cx="186" cy="84" r="13" fill="url(#sf-blue)"/>
    <text x="186" y="89" font-family="Poppins, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F9FAFB" text-anchor="middle">1</text>
  </g>
  <text x="148" y="218" font-family="Poppins, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#F9FAFB" text-anchor="middle">Download</text>
  <text x="148" y="240" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#9CA3AF" text-anchor="middle">Get the app</text>

  <!-- Step 2: Connect -->
  <g>
    <circle cx="380" cy="120" r="58" fill="rgba(15,118,110,0.12)" stroke="url(#sf-teal)" stroke-width="2.5"/>
    <rect x="345" y="96" width="26" height="44" rx="5" fill="none" stroke="#A5F3FC" stroke-width="2.5"/>
    <g stroke="#5EEAD4" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M386 106 a18 18 0 0 1 0 28"/>
      <path d="M396 99 a30 30 0 0 1 0 42"/>
      <path d="M406 92 a42 42 0 0 1 0 56"/>
    </g>
    <circle cx="412" cy="84" r="13" fill="url(#sf-teal)"/>
    <text x="412" y="89" font-family="Poppins, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F9FAFB" text-anchor="middle">2</text>
  </g>
  <text x="380" y="218" font-family="Poppins, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#F9FAFB" text-anchor="middle">Connect</text>
  <text x="380" y="240" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#9CA3AF" text-anchor="middle">Pair the system</text>

  <!-- Step 3: Start timing -->
  <g>
    <circle cx="612" cy="120" r="58" fill="rgba(34,197,94,0.10)" stroke="url(#sf-green)" stroke-width="2.5"/>
    <line x1="612" y1="80" x2="612" y2="92" stroke="#BBF7D0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="600" y1="80" x2="624" y2="80" stroke="#BBF7D0" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="612" cy="126" r="32" fill="none" stroke="#BBF7D0" stroke-width="2.5"/>
    <line x1="612" y1="126" x2="612" y2="106" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="612" y1="126" x2="628" y2="134" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="612" cy="126" r="3" fill="#86EFAC"/>
    <circle cx="650" cy="84" r="13" fill="url(#sf-green)"/>
    <text x="650" y="89" font-family="Poppins, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#F9FAFB" text-anchor="middle">3</text>
  </g>
  <text x="612" y="218" font-family="Poppins, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#F9FAFB" text-anchor="middle">Start timing</text>
  <text x="612" y="240" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#9CA3AF" text-anchor="middle">Live results</text>
</svg>
